# Uptime Kuma
server {
    listen 80;
    server_name status.rvlfauzan.my.id;

    location / {
        set $upstream_kuma http://uptime-kuma:3001;
        proxy_pass $upstream_kuma;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # WebSocket (socket.io) support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}

# Dozzle (streaming log via SSE: buffering harus mati)
server {
    listen 80;
    server_name logs.rvlfauzan.my.id;

    location / {
        set $upstream_dozzle http://dozzle:8080;
        proxy_pass $upstream_dozzle;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}

