services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    ports:
      - 3000:3000
    volumes:
      - /home/val/apps/homepage/config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock # Jika kamu pakai docker integration
    environment:
      - PUID=1000
      - PGID=1000
      - HOMEPAGE_ALLOWED_HOSTS=localhost:3000,127.0.0.1:3000,100.103.203.8:3000
